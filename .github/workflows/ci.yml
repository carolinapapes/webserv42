name: CI
run-name: ci automated tests
on:
  pull_request:
    branches:
      - main
jobs:
  Explore-GitHub-Actions-CI:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Linux development image
        run: docker build -f Dockerfile.dev -t webserv-dev .
      - name: Build and run unit tests in Linux
        run: docker run --rm -v "$PWD:/app" -w /app webserv-dev make test
